# Build the Sphinx documentation in docs/ and deploy it to GitHub Pages.
# The Pages source is set (in repository Settings > Pages) to "GitHub Actions";
# this workflow regenerates the site from docs/ + src/ notebooks on every push
# to main, so no generated HTML is committed (docs/ holds sources only).
name: Deploy docs to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. However, do NOT cancel in-progress runs as we
# want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch is enough for autodoc and saves ~2 GB of downloads
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install snntorch numpy scipy matplotlib seaborn pandas tqdm
          pip install sphinx furo nbsphinx myst-parser ipykernel
      - name: Build docs
        env:
          _RTD_VERSION: ${{ github.ref_name }}
        run: make -C docs html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/_build/html'

  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
